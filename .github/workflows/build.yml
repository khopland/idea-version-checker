# Build, test and verify the plugin. On main, prepare a draft GitHub release for a version with a changelog entry.
name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew buildPlugin test --console=plain
      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip
          if-no-files-found: error
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: build/reports/tests
          if-no-files-found: ignore

  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Verify plugin
        run: ./gradlew verifyPluginProjectConfiguration verifyPlugin --console=plain
      - name: Upload Plugin Verifier result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  releaseDraft:
    name: Release draft
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build, verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Read version
        id: metadata
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if grep -q "^## \[$version\]" CHANGELOG.md; then echo "releasable=true" >> "$GITHUB_OUTPUT"; fi
          if [[ "$version" == *-* ]]; then echo "channel=eap" >> "$GITHUB_OUTPUT"; else echo "channel=default" >> "$GITHUB_OUTPUT"; fi
      - name: Download tested plugin
        if: steps.metadata.outputs.releasable == 'true'
        uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: build/distributions
      - name: Prepare release draft
        if: steps.metadata.outputs.releasable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          CHANNEL: ${{ steps.metadata.outputs.channel }}
        run: bash .github/scripts/prepare_release_draft.sh
