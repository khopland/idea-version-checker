version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    exclude-paths:
      - "src/test/resources/**"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The demo projects in src/test/resources use old versions on purpose.
  # Ignoring every dependency also stops security-update pull requests for them.
  - package-ecosystem: "maven"
    directories:
      - "/src/test/resources/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "npm"
    directories:
      - "/src/test/resources/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "gradle"
    directories:
      - "/src/test/resources/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
